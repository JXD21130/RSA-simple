[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ciphr"
version = "0.1.0"
description = "Herramienta de línea de comandos RSA de ciphr"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
ciphr = "ciphr.cli:main"

[tool.setuptools]
packages = ["ciphr"]
